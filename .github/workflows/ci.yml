name: build-and-test

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.8'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust formatting
        run: cargo fmt --manifest-path kerniva_engine/Cargo.toml --check
      - name: Unix tests and race detector
        if: runner.os != 'Windows'
        run: bash scripts/test.sh -race
      - name: Windows tests and race detector
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;C:\msys64\ucrt64\bin;" + $env:PATH
          $env:CGO_ENABLED = "1"
          ./scripts/test.ps1 -Race
      - uses: actions/upload-artifact@v4
        with:
          name: kerniva-${{ runner.os }}-${{ runner.arch }}
          path: |
            bin/
            config.yaml
            README.md
