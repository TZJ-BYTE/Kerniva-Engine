<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="arch-title arch-desc">
<title id="arch-title">Kerniva 当前架构 · Go-log 模式</title>
<desc id="arch-desc">Go 主节点处理 TCP RESP 请求，按库对写日志进行合并同步，随后发布分片内存并回复。Rust 后台维护读取封存段，发布快照并回收历史。独立 Go 源侧车供两个只读副本分别拉取快照和封存段。每个副本按逻辑库独立轮询，同库依序处理，校验并持久化 CURRENT 后发布内存视图。</desc>
<defs><marker id="blue" viewBox="0 0 9 10" refX="9" refY="5" markerWidth="9" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#285e9a"/></marker><marker id="amber" viewBox="0 0 9 10" refX="9" refY="5" markerWidth="9" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#956013"/></marker><marker id="teal" viewBox="0 0 9 10" refX="9" refY="5" markerWidth="9" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#177673"/></marker><marker id="gray" viewBox="0 0 9 10" refX="9" refY="5" markerWidth="9" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L9 5 L0 10 Z" fill="#657990"/></marker><style>
text { font-family: "Microsoft YaHei", "Noto Sans SC", "Noto Sans CJK SC", sans-serif; fill: #1c2b42; }
.title { font-size: 44px; font-weight: 700; letter-spacing: .25px; }
.subtitle { font-size: 20px; fill: #4c6078; }
.section { font-size: 24px; font-weight: 700; }
.card-title { font-size: 22px; font-weight: 700; }
.body { font-size: 17px; fill: #314760; }
.edge { font-size: 15px; font-weight: 600; }
.edge-blue { fill: #285e9a; }
.edge-amber { fill: #956013; }
.edge-teal { fill: #177673; }
.note { font-size: 16px; fill: #4c6078; }
.route { fill: none; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
.blue { stroke: #285e9a; }
.amber { stroke: #956013; }
.teal { stroke: #177673; }
.gray { stroke: #657990; }
</style></defs>
<rect x="0" y="0" width="1600" height="1000" rx="0" fill="#f2f6fb" stroke="none"/>
<text class="title" x="62" y="75" text-anchor="start">Kerniva 当前架构</text>
<text class="subtitle" x="64" y="111" text-anchor="start">Go-log 同步写入 · Rust 后台快照 · 一主两只读副本</text>
<rect x="48" y="142" width="1504" height="267" rx="22" fill="#ffffff" stroke="#dce5f1"/><rect x="73" y="161" width="5" height="22" rx="2" fill="#285e9a" stroke="none"/><text class="section" x="91" y="181" text-anchor="start">在线读写 · Go 主节点</text>
<rect x="48" y="432" width="1504" height="234" rx="22" fill="#ffffff" stroke="#dce5f1"/><rect x="73" y="451" width="5" height="22" rx="2" fill="#956013" stroke="none"/><text class="section" x="91" y="471" text-anchor="start">后台维护与启动恢复</text>
<rect x="48" y="686" width="1504" height="256" rx="22" fill="#ffffff" stroke="#dce5f1"/><rect x="73" y="705" width="5" height="22" rx="2" fill="#177673" stroke="none"/><text class="section" x="91" y="725" text-anchor="start">异步复制 · 独立源侧车和只读副本</text>

<path d="M267 262 H355" class="route blue" marker-end="url(#blue)"/>
<path d="M355 320 H267" class="route blue" marker-end="url(#blue)"/>
<text class="edge edge-blue" x="311" y="250" text-anchor="middle">TCP / RESP</text>
<text class="edge edge-blue" x="311" y="308" text-anchor="middle">RESP 回复</text>
<path d="M627 267 H721" class="route blue" marker-end="url(#blue)"/>
<text class="edge edge-blue" x="674" y="255" text-anchor="middle">GET</text>
<path d="M721 320 H627" class="route blue" marker-end="url(#blue)"/><text class="edge edge-blue" x="674" y="308" text-anchor="middle">结果 / 确认</text><path d="M588 232 V213 H1334 V232" class="route blue" marker-end="url(#blue)"/>
<text class="edge edge-blue" x="956" y="203" text-anchor="middle">写命令 → 追加日志</text>
<path d="M1150 307 H1025" class="route blue" marker-end="url(#blue)"/>
<text class="edge edge-blue" x="1088" y="296" text-anchor="middle">同步成功</text>
<path d="M1334 354 V517" class="route amber" marker-end="url(#amber)"/>
<text class="edge edge-amber" x="1348" y="396" text-anchor="start">按大小或年龄封存</text>
<rect x="77" y="232" width="190" height="122" rx="16" fill="#f6f8fc" stroke="#dce5f1"/><text class="card-title" x="96" y="265" text-anchor="start">客户端</text><text class="body" x="96" y="294" text-anchor="start">TCP 长连接</text><text class="body" x="96" y="321" text-anchor="start">RESP 命令与回复</text>
<rect x="355" y="232" width="272" height="122" rx="16" fill="#edf5ff" stroke="#b6cfee"/><text class="card-title" x="374" y="265" text-anchor="start">Go 协议与命令</text><text class="body" x="374" y="294" text-anchor="start">net / gnet · RESP</text><text class="body" x="374" y="321" text-anchor="start">按逻辑库路由请求</text>
<rect x="721" y="232" width="304" height="122" rx="16" fill="#edf5ff" stroke="#b6cfee"/><text class="card-title" x="740" y="265" text-anchor="start">Go 分片内存</text><text class="body" x="740" y="294" text-anchor="start">读取已发布的值</text><text class="body" x="740" y="321" text-anchor="start">同步成功后发布变更</text>
<rect x="1150" y="232" width="372" height="122" rx="16" fill="#edf5ff" stroke="#b6cfee"/><text class="card-title" x="1169" y="265" text-anchor="start">每库活动日志</text><text class="body" x="1169" y="294" text-anchor="start">每个写请求分配提交序号</text><text class="body" x="1169" y="321" text-anchor="start">追加记录 · 合并同步（默认最多 8 帧）</text>

<path d="M1150 574 H1030" class="route amber" marker-end="url(#amber)"/>
<text class="edge edge-amber" x="1090" y="562" text-anchor="middle">读取封存段</text>
<path d="M700 574 H595" class="route amber" marker-end="url(#amber)"/>
<text class="edge edge-amber" x="648" y="562" text-anchor="middle">生成与发布</text>
<path d="M345 574 H301" class="route gray" marker-end="url(#gray)"/>
<rect x="77" y="517" width="224" height="119" rx="16" fill="#f6f8fc" stroke="#dce5f1"/><text class="card-title" x="96" y="550" text-anchor="start">Rust 恢复库</text><text class="body" x="96" y="579" text-anchor="start">主库启动时经 C ABI 调用</text><text class="body" x="96" y="606" text-anchor="start">回放快照与日志到内存</text>
<rect x="345" y="517" width="250" height="119" rx="16" fill="#fff6e8" stroke="#e9c790"/><text class="card-title" x="364" y="550" text-anchor="start">快照与清单</text><text class="body" x="364" y="579" text-anchor="start">完整状态和截止序号</text><text class="body" x="364" y="606" text-anchor="start">同步并发布 CURRENT</text>
<rect x="700" y="517" width="330" height="119" rx="16" fill="#fff6e8" stroke="#e9c790"/><text class="card-title" x="719" y="550" text-anchor="start">独立 Rust 维护进程</text><text class="body" x="719" y="579" text-anchor="start">维护封存日志并生成快照</text><text class="body" x="719" y="606" text-anchor="start">快照发布后回收已覆盖日志</text>
<rect x="1150" y="517" width="372" height="119" rx="16" fill="#fff6e8" stroke="#e9c790"/><text class="card-title" x="1169" y="550" text-anchor="start">每库不可变封存段</text><text class="body" x="1169" y="579" text-anchor="start">段内保留有序提交记录</text><text class="body" x="1169" y="606" text-anchor="start">用于快照、恢复和复制</text>

<path d="M470 636 V657 H1334 V636" class="route teal"/>
<path d="M546 657 V738 H231 V753" class="route teal" marker-end="url(#teal)"/>
<text class="edge edge-teal" x="925" y="652" text-anchor="middle">源侧车从主库数据目录读取快照与封存段</text>
<path d="M399 788 H468 V763 H737 V786" class="route teal" marker-end="url(#teal)"/>
<path d="M737 763 H1307 V786" class="route teal" marker-end="url(#teal)"/>
<text class="edge edge-teal" x="936" y="752" text-anchor="middle">副本各自发起 HTTP GET /pull · 箭头表示响应文件</text>
<rect x="77" y="753" width="322" height="151" rx="16" fill="#edf8f7" stroke="#a6d5d1"/><text class="card-title" x="96" y="786" text-anchor="start">Go 复制源侧车</text><text class="body" x="96" y="815" text-anchor="start">独立进程 · GET /pull</text><text class="body" x="96" y="842" text-anchor="start">按库及序号导出封存段</text><text class="body" x="96" y="869" text-anchor="start">游标落后于保留范围时发送快照和尾段</text>
<rect x="526" y="786" width="422" height="140" rx="16" fill="#edf8f7" stroke="#a6d5d1"/><text class="card-title" x="545" y="819" text-anchor="start">只读副本 A</text><text class="body" x="545" y="848" text-anchor="start">独立目录 · 按库独立轮询，同库串行</text><text class="body" x="545" y="875" text-anchor="start">校验 → 持久化 CURRENT → 发布内存视图</text><text class="body" x="545" y="902" text-anchor="start">只读 HTTP · /get 与 /status</text>
<rect x="1096" y="786" width="426" height="140" rx="16" fill="#edf8f7" stroke="#a6d5d1"/><text class="card-title" x="1115" y="819" text-anchor="start">只读副本 B</text><text class="body" x="1115" y="848" text-anchor="start">独立目录 · 按库独立轮询，同库串行</text><text class="body" x="1115" y="875" text-anchor="start">校验 → 持久化 CURRENT → 发布内存视图</text><text class="body" x="1115" y="902" text-anchor="start">只读 HTTP · /get 与 /status</text>
<text class="note" x="63" y="973" text-anchor="start">部署范围：单 WSL 回环环境。Rust C ABI 用于主库与副本的启动恢复，以及副本安装。</text>
</svg>