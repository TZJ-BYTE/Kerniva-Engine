host: "127.0.0.1"
port: 16379
network_type: "gnet"
db_count: 16
storage_backend: "go-log"
max_memory: 268435456
max_memory_policy: "noeviction"
persistence_enabled: true
# Enable or disable each feature independently. Either setting may be specified on its own.
# Omitting both preserves the existing Go log and external Rust maintainer.
# go_log_enabled: true
# snapshot_enabled: false
# snapshot_interval_seconds: 300
data_dir: "./data"
cold_start_strategy: "load_all"
persistence_write_mode: "strong"
persistence_durability: "sync"
engine_segment_size: 4194304
go_log_segment_age_seconds: 30
go_log_group_max: 8
log_level: "info"
log_path: "./logs/kerniva-go-log.log"
